# Local stack. `docker compose up` gives a seeded center at http://localhost:3000.
# Postgres and Redis use non-default host ports so they don't collide with Homebrew services.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: cubby
      POSTGRES_PASSWORD: cubby
      POSTGRES_DB: cubby_development
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cubby"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  # Local SNS, SQS, and S3 for the event pipeline. Moto needs no account or token.
  aws:
    image: motoserver/moto:5.2.4
    ports: ["5055:5000"]

  api: &api
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails db:prepare && bin/rails db:seed && bin/rails events:setup && bin/rails server -b 0.0.0.0 -p 3000"
    # bin/aws-env writes .env.aws with the cubby profile's keys only; without it, AI features report unavailable.
    env_file:
      - path: .env.aws
        required: false
    environment: &api_env
      RAILS_ENV: development
      DATABASE_URL: postgres://cubby:cubby@db:5432/cubby_development
      REDIS_URL: redis://redis:6379/0
      # Events go to the local emulator, never to real AWS, in development.
      EVENTS_AWS_ENDPOINT: http://aws:5000
    ports: ["3000:3000"]
    volumes: [./api:/app]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      aws: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "ruby -rnet/http -e 'exit Net::HTTP.get_response(URI(\"http://localhost:3000/up\")).is_a?(Net::HTTPSuccess) ? 0 : 1'"]
      interval: 5s
      retries: 40

  sidekiq:
    <<: *api
    command: bundle exec sidekiq -C config/sidekiq.yml
    restart: unless-stopped
    ports: []
    healthcheck: { disable: true }
    depends_on:
      api: { condition: service_started }

  # Analytics consumer: SQS -> domain_events.
  events:
    <<: *api
    command: bundle exec rails events:consume
    restart: unless-stopped
    ports: []
    healthcheck: { disable: true }
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
