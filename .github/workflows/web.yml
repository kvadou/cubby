name: web

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]

defaults:
  run:
    working-directory: web

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  # main only: publish the built app to S3 and refresh CloudFront.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency: { group: deploy-web, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::731956852586:role/cubby-github-deploy
          aws-region: us-east-1
      # Hashed assets cache for a year; index.html is revalidated so a deploy shows up right away. The app
      # screenshots keep their names when retaken, so they cache for a day instead.
      - run: aws s3 sync dist s3://cubby-web-731956852586 --delete --exclude index.html --exclude "apps/*" --cache-control "public, max-age=31536000, immutable"
      - run: aws s3 sync dist/apps s3://cubby-web-731956852586/apps --delete --cache-control "public, max-age=86400"
      - run: aws s3 cp dist/index.html s3://cubby-web-731956852586/index.html --cache-control "no-cache"
      - run: aws cloudfront create-invalidation --distribution-id E4J9OMSY7N4SK --paths "/index.html" "/" "/apps/*"
