# The demo host's stack (infra/terraform/demo). deploy.sh writes CUBBY_IMAGE into .env next to this file.
# Before the API starts, `prepare` migrates, seeds the fictional demo (idempotent), and scans, the same
# steps as the init container on EKS (deploy/production/api.yaml).
#
# Postgres and Valkey sit only on `data`, an internal network with no way out, so those third-party images
# can't reach the instance role through the metadata service. The app containers also join `egress`.
x-app: &app
  image: ${CUBBY_IMAGE:?deploy.sh sets CUBBY_IMAGE}
  env_file: [app.env]
  restart: unless-stopped
  networks: [data, egress]
  depends_on: &ready
    db: { condition: service_healthy }
    cache: { condition: service_healthy }

services:
  db:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    env_file: [db.env]
    environment:
      POSTGRES_USER: cubby
      POSTGRES_DB: cubby
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cubby"]
      interval: 5s
      retries: 30

  # Sidekiq queues, cron state, rate limits, and cache; nothing here needs to survive a restart.
  cache:
    image: valkey/valkey:8.1-alpine@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "384mb", "--maxmemory-policy", "noeviction"]
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      retries: 30

  prepare:
    <<: *app
    command: ["./bin/rails", "db:prepare", "db:seed", "cubby:scan"]
    restart: "no"

  api:
    <<: *app
    command: ["./bin/rails", "server"]
    ports: ["80:3000"]
    depends_on:
      <<: *ready
      prepare: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/up"]
      interval: 15s
      retries: 5
      start_period: 30s

  sidekiq:
    <<: *app
    command: ["bundle", "exec", "sidekiq"]
    depends_on:
      <<: *ready
      prepare: { condition: service_completed_successfully }

  events:
    <<: *app
    command: ["./bin/rails", "events:consume"]
    depends_on:
      <<: *ready
      prepare: { condition: service_completed_successfully }

networks:
  data:
    internal: true
  egress: {}

volumes:
  pgdata:
