# One service account per workload; EKS Pod Identity maps each to its own IAM role (infra/terraform/cluster/iam.tf).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cubby-api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cubby-worker
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cubby-events
