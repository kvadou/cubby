# Sidekiq: drafts, scans, the outbox publisher, the nightly S3 export, and the cron schedule.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sidekiq
  labels: { app: sidekiq }
spec:
  replicas: 1
  strategy: { type: Recreate } # one cron scheduler at a time
  selector:
    matchLabels: { app: sidekiq }
  template:
    metadata:
      labels: { app: sidekiq }
    spec:
      serviceAccountName: cubby-worker
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: sidekiq
          image: cubby-api
          command: ["bundle", "exec", "sidekiq"]
          envFrom:
            - configMapRef: { name: cubby-config }
            - secretRef: { name: cubby-secrets }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 300Mi }
            limits: { memory: 600Mi }
